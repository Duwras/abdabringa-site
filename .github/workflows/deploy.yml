# Minden main-re küldött push után újraépíti és közzéteszi az oldalt.
# A deploy/ mappa nincs verziókövetve — itt készül el, minden futáskor
# a forrásból, hogy sose csússzon szét a repó és az éles oldal.
name: Közzététel

on:
  push:
    branches: [main]
  # kézi indítás az Actions fülről, ha újra kell rakni közzététel nélkül
  workflow_dispatch:

# A Pages közzétételéhez ennyi jog kell, többhöz nincs.
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy közzététel fusson. Ha gyors egymásutánban két push
# érkezik, a régebbi várakozó futás elmarad — de a már futó befejeződik,
# hogy ne maradjon félkész oldal kint.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Teljes előzmény: a sitemap <lastmod> dátumai a fájlok utolsó
      # commitjából számolnak (build-functions.mjs). Sekély klónban
      # minden oldal a legutolsó commit dátumát kapná.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ez kapcsolja be a Pages-t a repón, ha még nem volt bekapcsolva —
      # a deploy-pages önmagában nem tudja létrehozni, csak használni.
      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # a sharp képtömörítéshez kell; a build enélkül nem fut le
      - run: npm ci

      - run: npm run build

      # SEO-ellenőrzés: törött belső link, hiányzó/duplikált title,
      # több H1, hibás canonical vagy JSON-LD esetén a közzététel leáll.
      - run: npm run ellenorzes

      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
