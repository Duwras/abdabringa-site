[build]
  publish = "deploy"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# FIGYELEM: a /api/bikes és a /api/login címekre NEM szabad
# rewrite-ot tenni. Azokat a bikes.mjs saját `config.path`-ja
# kezeli, és amint egy függvény saját útvonalat deklarál, a
# /.netlify/functions/bikes alapcím megszűnik. A force = true
# rewrite viszont pont oda irányítana → 404 mindenre.
#
# A bike-image nem deklarál útvonalat, ezért annak kell a rewrite.
[[redirects]]
  from = "/api/bike-image/:id"
  to = "/.netlify/functions/bike-image?id=:id"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Az admin.html statikus fájl — bárki letöltheti, aki kitalálja a
# címét. Ez nem baj: nincs benne semmi, csak egy űrlap. Az érdemi
# védelem a függvényben van (src/lib/auth.mjs). A szigorú CSP
# viszont azt is megakadályozza, hogy egy beszúrt idegen script
# elvihesse a munkamenet-tokent.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"

# Az API válaszai sosem kerülhetnek gyorsítótárba (se a böngészőben,
# se köztes proxyn), és a hivatkozó címet sem visszük magunkkal.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# ---- SEO / teljesítmény: gyorsítótár ----
# A HTML mindig frissüljön, a képek és a statikus fájlok viszont
# maradhatnak sokáig a böngészőben — ez javítja a Core Web Vitals
# értékeket a visszatérő látogatóknál.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# A betűfájlok neve a Google verziózott URL-jéből származik, tehát
# egy adott fájl tartalma sosem változik — egy évig cache-elhető.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# MEGJEGYZÉS a *.netlify.app címről: ha a Netlify felületén
# a abdabringa.hu az "elsődleges domain", a Netlify magától 301-gyel
# átirányítja rá a *.netlify.app és a www. változatot is. Ezért itt
# nem kell külön redirect — a canonical + a 301 elintézi a duplikált
# tartalom kérdését.
